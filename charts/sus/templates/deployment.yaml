apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sus.fullname" . }}-landing
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sus.labels" . | nindent 4 }}
    app.kubernetes.io/component: landing
spec:
  replicas: {{ .Values.landing.replicaCount }}
  selector:
    matchLabels:
      {{- include "sus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: landing
  template:
    metadata:
      labels:
        {{- include "sus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: landing
      {{- if .Values.auth.enabled }}
      annotations:
        # Roll the deployment whenever the identity config changes — the app
        # reads sus_config.json at startup, so a stale pod would silently keep
        # the old trusted-proxy set.
        checksum/landing-config: {{ include (print $.Template.BasePath "/landing-config.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.landing.serviceAccount.name }}
      containers:
        - name: landing
          image: "{{ .Values.landing.image.repository }}:{{ .Values.landing.image.tag }}"
          imagePullPolicy: {{ .Values.landing.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.landing.port }}
              protocol: TCP
          env:
            - name: SUS_WORKLOADS_NAMESPACE
              value: {{ .Values.namespaces.workloads | quote }}
            - name: SUS_BUILD_IMAGE
              value: "{{ .Values.buildPod.image.repository }}:{{ .Values.buildPod.image.tag }}"
            - name: SUS_GIT_REPO_URL
              value: {{ .Values.gitRepo.url | quote }}
            - name: SUS_CLAUDE_MODEL
              value: {{ .Values.buildPod.claudeModel | quote }}
            - name: SUS_REPO_CLONE_DIR
              value: /data/repo
            {{- if .Values.auth.enabled }}
            - name: SUS_CONFIG_PATH
              value: /config/sus_config.json
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.landing.resources | nindent 12 }}
          volumeMounts:
            - name: repo-data
              mountPath: /data
            {{- if .Values.auth.enabled }}
            - name: sus-config
              mountPath: /config
              readOnly: true
            {{- end }}
      volumes:
        - name: repo-data
          emptyDir: {}
        {{- if .Values.auth.enabled }}
        - name: sus-config
          configMap:
            name: {{ include "sus.fullname" . }}-landing-config
        {{- end }}
