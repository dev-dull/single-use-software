{{- if and .Values.auth.enabled (not .Values.auth.authelia.secrets.existingSecret) }}
# Authelia users database + runtime secrets. Rendered only when no
# existingSecret is supplied. The default values are PLACEHOLDERS — override
# them (see values.yaml / README) before exposing SUS.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sus.authelia.fullname" . }}
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sus.labels" . | nindent 4 }}
    app.kubernetes.io/component: authelia
type: Opaque
stringData:
  session: {{ .Values.auth.authelia.secrets.session | quote }}
  storage-encryption: {{ .Values.auth.authelia.secrets.storageEncryption | quote }}
  jwt: {{ .Values.auth.authelia.secrets.jwt | quote }}
  users_database.yml: |
    users:
      {{- range .Values.auth.authelia.users }}
      {{ .username }}:
        displayname: {{ .displayname | default .username | quote }}
        password: {{ .password | quote }}
        email: {{ .email | default "" | quote }}
        groups:
          {{- range .groups }}
          - {{ . | quote }}
          {{- end }}
      {{- end }}
{{- end }}
