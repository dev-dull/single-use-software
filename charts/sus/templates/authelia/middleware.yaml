{{- if .Values.auth.enabled }}
# Traefik forward-auth middleware. Referenced by the SUS ingress via the
# router.middlewares annotation. Authelia authenticates each request and, on
# success, returns the identity as Remote-* response headers, which Traefik
# copies onto the request to the landing pod (overwriting any client-supplied
# copy — design doc requirement #3).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "sus.forwardAuth.middlewareName" . }}
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sus.labels" . | nindent 4 }}
    app.kubernetes.io/component: authelia
spec:
  forwardAuth:
    address: {{ printf "http://%s.%s.svc.cluster.local:9091/api/authz/forward-auth" (include "sus.authelia.fullname" .) .Values.namespaces.platform | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
