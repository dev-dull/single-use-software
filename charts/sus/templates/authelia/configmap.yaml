{{- if .Values.auth.enabled }}
# Minimal Authelia reference configuration for a homelab SUS deployment.
# File-based users, one-factor policy, ephemeral SQLite. Review before
# exposing publicly (add TLS, a real notifier, and persistent storage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sus.authelia.fullname" . }}
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sus.labels" . | nindent 4 }}
    app.kubernetes.io/component: authelia
data:
  configuration.yml: |
    theme: light
    server:
      address: 'tcp://:9091'
    log:
      level: info
    totp:
      issuer: {{ .Values.auth.domain | quote }}
    authentication_backend:
      password_reset:
        disable: true
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2
    access_control:
      default_policy: one_factor
    session:
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 5m
      cookies:
        - domain: {{ .Values.auth.domain | quote }}
          authelia_url: {{ printf "http://auth.%s" .Values.auth.domain | quote }}
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      local:
        path: /data/db.sqlite3
    notifier:
      filesystem:
        filename: /data/notification.txt
{{- end }}
