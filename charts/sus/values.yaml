# -- Namespace configuration
namespaces:
  # -- Namespace for the SUS control plane (landing page pod)
  platform: sus
  # -- Namespace for build and run workload pods
  workloads: sus-workloads

# -- Landing page deployment configuration
landing:
  image:
    repository: ghcr.io/dev-dull/sus-landing
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  port: 8000
  serviceAccount:
    name: sus-landing
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Service configuration for the landing page
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# -- Build pod configuration (user editing sessions)
buildPod:
  image:
    repository: ghcr.io/dev-dull/sus-build
    tag: latest
    pullPolicy: Always
  # -- Claude model for build sessions. Aliases like "sonnet", "opus", and
  # "haiku" resolve to the latest model in that family; a full model ID
  # (e.g. "claude-sonnet-5") pins a specific version.
  claudeModel: sonnet
  ports:
    terminal: 8080
    preview: 3000
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# -- Ingress configuration
ingress:
  enabled: false
  # -- Ingress class name (e.g., nginx, traefik)
  className: ""
  # -- Hostname for the ingress
  host: sus.local
  # -- Annotations (WebSocket support is required — see README)
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
  # -- TLS configuration
  tls: []
  #  - secretName: sus-tls
  #    hosts:
  #      - sus.local

# -- Authentication (forward-auth). Disabled by default: SUS runs single-user
# with no login. When enabled, a bundled Authelia is deployed and the landing pod
# switches to trusted-header (proxy-header) identity.
#
# The chart is INGRESS-AGNOSTIC: it does not wire your ingress controller, because
# forward-auth has no portable Kubernetes API (Traefik uses a Middleware CRD,
# nginx uses auth-url annotations, etc.). You add the forward-auth rule for your
# controller — see the README "Authentication (Authelia)" section. Until then the
# landing app sees no identity and treats every request as an anonymous guest.
auth:
  enabled: false
  # -- Base domain. Serve the SUS app at ingress.host (which MUST be this domain
  # or a subdomain of it) and the Authelia portal at auth.<domain>, so a single
  # session cookie scoped to <domain> covers both.
  domain: sus.local
  # -- Source IP/CIDR(s) of your ingress controller's pods. Only identity headers
  # from these peers are trusted by the landing app (everything else is anonymous).
  # For k3s/k3d this is typically the cluster pod CIDR, e.g. ["10.42.0.0/16"].
  # Leave empty ONLY for testing — an empty list trusts headers from any source.
  trustedProxies: []
  # -- Namespace your ingress controller runs in. A NetworkPolicy restricts the
  # landing pod so identity-bearing UI traffic can only arrive from here.
  # k3s/k3d Traefik = kube-system; nginx-ingress = ingress-nginx.
  ingressNamespace: kube-system
  authelia:
    image:
      repository: authelia/authelia
      # Pinned minor tag — Authelia's config schema is version-sensitive.
      tag: "4.38"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    # -- Reference file-based users for the homelab quickstart. Each entry needs
    # an argon2id `password` hash (generate with:
    #   docker run authelia/authelia:4.38 authelia crypto hash generate argon2 --password '<pw>')
    # Replace this before exposing SUS to anyone.
    users:
      - username: admin
        displayname: "SUS Admin"
        # Placeholder hash for the password "authelia" — CHANGE THIS.
        password: "$argon2id$v=19$m=65536,t=3,p=4$c3VzcGxhY2Vob2xkZXI$Zt1sJ8Xh0m0Wd1oQ9m0h9m0h9m0h9m0h9m0h9m0h9m0"
        email: admin@example.com
        groups:
          - admins
          - default
    secrets:
      # -- If set, the chart will NOT render its own Secret; provide a Secret
      # with keys: session, storage-encryption, jwt. Recommended for real use.
      existingSecret: ""
      # -- Placeholder secrets used only when existingSecret is empty. OVERRIDE
      # these (e.g. --set auth.authelia.secrets.session=$(openssl rand -hex 32)).
      session: "PLACEHOLDER-CHANGE-ME-session-secret"
      storageEncryption: "PLACEHOLDER-CHANGE-ME-storage-encryption-key"
      jwt: "PLACEHOLDER-CHANGE-ME-jwt-secret"

# -- Git repository for the app monorepo
gitRepo:
  # -- URL of the monorepo (HTTPS or SSH)
  url: ""

# -- RBAC role name for pod management in the workloads namespace
rbac:
  roleName: sus-pod-manager
  roleBindingName: sus-landing-binding
