<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤨</text></svg>" />
  <title>SUS — Single Use Software</title>
  <link rel="stylesheet" href="/static/desktop/theme.css" />
  <link rel="stylesheet" href="/static/desktop/desktop.css" />
  <style>
    /* Structural layout only — all color/type comes from desktop.css tokens. */
    .desktop__icons {
      position: absolute;
      top: 1.25rem; left: 1.25rem; right: 1.25rem;
      display: flex; flex-wrap: wrap;
      gap: 1rem 1.25rem;
      align-content: flex-start;
    }
    /* Grid of app icons shown inside an open folder window. */
    .folder-view {
      display: flex; flex-wrap: wrap;
      gap: 1rem 1.25rem;
      padding: 1rem;
      align-content: flex-start;
    }
    .folder-view__empty { padding: 1rem; font: inherit; }
    /* Hidden templates never render on their own. */
    template { display: none; }
  </style>
</head>
<body>
  <!-- ===== Menu bar ===== -->
  <div class="menubar" id="menubar">
    <span class="menubar__logo" id="apple-menu" title="I'm watching you build things.">🤨</span>
    <span class="menubar__menu" data-menu="file">File</span>
    <span class="menubar__menu" data-menu="view">View</span>
    <span class="menubar__spacer"></span>
    <input
      class="menubar__search"
      id="desktop-search"
      type="search"
      placeholder="Find…"
      value="{{ query }}"
      autocomplete="off"
    />
    <span class="menubar__clock" id="menubar-clock">--:--</span>
  </div>

  <!-- ===== Desktop surface ===== -->
  <div class="desktop" id="desktop">
    <div class="desktop__icons" id="desktop-icons">

      <!-- New App -->
      <div class="icon icon--new" data-open-url="/new" data-title="New App" tabindex="0">
        <div class="icon__glyph"></div>
        <div class="icon__label">New App</div>
      </div>

      <!-- One folder per team -->
      {% for team, apps in catalog | groupby('team') %}
      <div class="icon icon--folder" data-team="{{ team }}" tabindex="0">
        <div class="icon__glyph"></div>
        <div class="icon__label">{{ team }}</div>
      </div>
      {% endfor %}

      {% if not catalog %}
      <div class="icon icon--new" data-open-url="/new" data-title="New App" tabindex="0">
        <div class="icon__glyph"></div>
        <div class="icon__label">No apps yet — build one!</div>
      </div>
      {% endif %}
    </div>

    <!-- Window layer (managed by wm.js) -->
    <div id="windows"></div>
  </div>

  <!-- ===== Per-team icon templates (cloned into a window when a folder opens) ===== -->
  {% for team, apps in catalog | groupby('team') %}
  <template data-folder="{{ team }}">
    <div class="folder-view">
      {% for app in apps %}
      <div class="icon icon--app"
           tabindex="0"
           data-name="{{ app.name }}"
           data-team="{{ app.team }}"
           data-slug="{{ app.slug }}"
           data-desc="{{ app.get('description', '') }}"
           data-tags="{{ app.get('tags', []) | join(',') }}"
           data-run-url="/run/{{ app.team }}/{{ app.slug }}"
           data-build-url="/build/{{ app.team }}/{{ app.slug }}"
           data-history-url="/versions/{{ app.team }}/{{ app.slug }}">
        <div class="icon__glyph"></div>
        <div class="icon__label">{{ app.name }}</div>
      </div>
      {% endfor %}
    </div>
  </template>
  {% endfor %}

  <!-- ===== Setup alert (classic Mac dialog) ===== -->
  {% if not setup_complete %}
  <template id="setup-alert-tpl">
    <div class="mac-alert__body">
      <p><strong>SUS needs configuration</strong></p>
      <p>Set up your API key, Git access, and repo before building and publishing apps.</p>
    </div>
    <div class="mac-alert__actions">
      <a class="mac-btn mac-btn--default" href="/setup">Open Setup</a>
    </div>
  </template>
  {% endif %}

  <!-- Identity + flags for the glue script -->
  <script id="desktop-data" type="application/json">
    {
      "user": {{ identity.display_name | tojson }},
      "setupComplete": {{ setup_complete | tojson }}
    }
  </script>

  <!-- Modules: window manager + popup menus, then the glue. -->
  <script src="/static/desktop/wm.js"></script>
  <script src="/static/desktop/contextmenu.js"></script>
  <script src="/static/desktop/desktop.js"></script>
</body>
</html>
