<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤨</text></svg>" />
  <title>{% if mode == 'create' %}New Skill{% else %}Edit {{ skill.name }}{% endif %} — SUS</title>
  <link rel="stylesheet" href="/static/desktop/theme.css" />
  <style>
    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 { margin-bottom: 1.5rem; }

    .errors {
      background: var(--panel-2);
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: .75rem 1rem;
      margin-bottom: 1rem;
      color: var(--danger);
      font-size: .9rem;
    }

    .errors ul { margin-left: 1.25rem; }

    textarea {
      font-family: var(--font-mono);
      font-size: .88rem;
      line-height: 1.6;
      min-height: 420px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: .75rem;
      align-items: center;
      margin-top: .5rem;
    }

    .guide-link {
      font-size: .85rem;
      margin-left: auto;
    }

    .preview-area {
      display: none;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: 1rem;
      font-size: .95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      font-family: inherit;
    }

    .preview-area.visible { display: block; }
  </style>
</head>
<body>
  <div class="sus-page container">
    <h1>{% if mode == 'create' %}Create New Skill{% else %}Edit: {{ skill.name }}{% endif %}</h1>

    {% if errors %}
    <div class="errors">
      <ul>
        {% for err in errors %}
        <li>{{ err }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <form method="post"
          action="{% if mode == 'create' %}/skills{% else %}/skills/{{ skill.name }}/update{% endif %}">
      {% if mode == 'create' %}
      <div class="field">
        <label for="name">Skill Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. data-engineering"
               value="{{ skill.name if skill else '' }}" required />
      </div>
      {% endif %}

      <div class="field">
        <label for="content">Content (Markdown)</label>
        <textarea id="content" name="content" placeholder="# Skill: Domain Name&#10;&#10;> Summary of this skill...">{{ skill.content if skill else '' }}</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary">Save</button>
        <button type="button" class="btn btn--ghost" onclick="togglePreview()">Preview</button>
        <a class="btn btn--ghost" href="/skills">Cancel</a>
        <a class="guide-link" href="/skills/guide" target="_blank">Authoring Guide</a>
      </div>
    </form>

    <div id="preview" class="preview-area"></div>
  </div>

  <script>
    function togglePreview() {
      var preview = document.getElementById('preview');
      var content = document.getElementById('content').value;
      if (preview.classList.contains('visible')) {
        preview.classList.remove('visible');
      } else {
        preview.textContent = content;
        preview.classList.add('visible');
      }
    }
  </script>
</body>
</html>
