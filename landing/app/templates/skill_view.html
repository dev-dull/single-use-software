<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤨</text></svg>" />
  <title>{{ skill_name }} — SUS Skills</title>
  <link rel="stylesheet" href="/static/desktop/theme.css" />
  <style>
    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .top-actions {
      display: flex;
      gap: .5rem;
    }

    .content-body {
      line-height: 1.7;
      padding: 1.5rem 2rem;
    }

    .content-body h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
    .content-body h2 { font-size: 1.2rem; margin: 1.25rem 0 .5rem; }
    .content-body h3 { font-size: 1.05rem; margin: 1rem 0 .4rem; }
    .content-body p { margin-bottom: .75rem; }
    .content-body ul, .content-body ol { margin: .5rem 0 .75rem 1.5rem; }
    .content-body code {
      font-family: var(--font-mono);
      font-size: .88em;
      background: var(--panel-2);
      padding: .15em .35em;
      border-radius: var(--radius-sm);
    }
    .content-body pre {
      margin: .75rem 0;
      line-height: 1.5;
    }
    .content-body pre code {
      background: none;
      padding: 0;
      color: inherit;
    }
    .content-body table {
      width: 100%;
      border-collapse: collapse;
      margin: .75rem 0;
      font-size: .9rem;
    }
    .content-body th, .content-body td {
      border: 1px solid var(--line);
      padding: .45rem .65rem;
      text-align: left;
    }
    .content-body th { background: var(--panel-2); font-weight: 600; }
    .content-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--ink-soft);
      margin: .75rem 0;
    }
    .content-body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 1.25rem 0;
    }
  </style>
</head>
<body>
  <div class="sus-page container">
    <div class="top-bar sus-header">
      <h1>{{ skill_name }}</h1>
      <div class="top-actions">
        {% if not is_guide %}
        <a class="btn btn--primary" href="/skills/{{ skill_name }}/edit">Edit</a>
        {% if skill_name.upper() != "AUTHORING" %}
        <form method="post" action="/skills/{{ skill_name }}/delete" style="display:inline"
              onsubmit="return confirm('Delete skill {{ skill_name }}?');">
          <input type="hidden" name="_method" value="DELETE" />
          <button type="submit" class="btn btn--danger">Delete</button>
        </form>
        {% endif %}
        {% endif %}
      </div>
    </div>

    <div class="content-body card">
      {{ content_html | safe }}
    </div>

    <a class="back-link" href="/skills">Back to skills list</a>
  </div>
</body>
</html>
