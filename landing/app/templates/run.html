<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤨</text></svg>" />
  <title>{{ team }}/{{ app_slug }} — SUS</title>
  <link rel="stylesheet" href="/static/desktop/theme.css" />
  <style>
    :root {
      --header-height: 48px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .header {
      height: var(--header-height);
      background: var(--chrome-solid);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }

    .header .app-name {
      font-size: .95rem;
      font-weight: 600;
      color: var(--ink);
    }

    .header .back-link {
      margin-bottom: 0;
      font-weight: 500;
    }

    .app-frame {
      width: 100%;
      height: calc(100% - var(--header-height));
      border: none;
      background: var(--panel-solid);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="app-name">{{ team }}/{{ app_slug }}</span>
    <a class="back-link" href="/">Back to catalog</a>
  </div>
  <iframe class="app-frame" src="/run/{{ team }}/{{ app_slug }}/proxy/"></iframe>
</body>
</html>
